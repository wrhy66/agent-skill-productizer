name: Custom Skill Request
description: Request a private agent skill for a workflow.
title: "[Custom Skill]: "
labels: ["custom-skill", "paid-request"]
body:
  - type: markdown
    attributes:
      value: |
        Use this form to request a private agent skill for one narrow repeatable workflow.
        Issues are public. Do not paste secrets, credentials, private customer data, or confidential internal documents.
  - type: input
    id: workflow-name
    attributes:
      label: Workflow name
      description: What should this private skill help with?
      placeholder: "Example: Turn support tickets into a weekly product triage brief"
    validations:
      required: true
  - type: textarea
    id: current-process
    attributes:
      label: Current process
      description: Describe how you do this workflow today.
      placeholder: "Inputs, steps, tools, outputs, pain points..."
    validations:
      required: true
  - type: textarea
    id: desired-output
    attributes:
      label: Desired output
      description: What should the agent produce when the skill is used?
      placeholder: "A report, code review checklist, migration plan, launch pack..."
    validations:
      required: true
  - type: textarea
    id: constraints
    attributes:
      label: Constraints
      description: Any rules, examples, file types, privacy constraints, or tools involved?
      placeholder: "No private data in examples; must support Markdown and CSV; use our internal rubric..."
  - type: textarea
    id: sanitized-example
    attributes:
      label: Sanitized example
      description: Paste a small sanitized input/output example if you have one.
      placeholder: "Remove customer names, emails, secrets, and private business data."
  - type: dropdown
    id: budget
    attributes:
      label: Budget range
      options:
        - "499 RMB starter workflow"
        - "1000-3000 RMB custom workflow"
        - "3000+ RMB team/private implementation"
        - "Not sure yet"
    validations:
      required: true
  - type: dropdown
    id: public-example-permission
    attributes:
      label: May a sanitized version become a public example?
      description: This is optional and never includes private data.
      options:
        - "No"
        - "Yes, after anonymization"
        - "Ask me later"
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope confirmation
      options:
        - label: I understand the 499 RMB starter scope is for one narrow workflow, not a broad assistant.
          required: true
        - label: I understand this project does not guarantee sales, traffic, rankings, or revenue outcomes.
          required: true
  - type: markdown
    attributes:
      value: |
        Note: This project does not guarantee sales, traffic, rankings, or revenue outcomes.
